# Benchmark native binary (5 runs) and one scorer-style docker run.
name: bench
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to benchmark"
        default: main
      events:
        description: "Number of events to generate"
        default: "10000000"
      modes:
        description: "Scorer-emulation A/B modes (warm cold hog twin), space-separated; empty = standard bench"
        default: ""
      base:
        description: "Base ref the modes A/B compares against"
        default: "main"
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVENTS: ${{ inputs.events }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install Rust stable
        run: rustup default stable
      - name: Build generator and generate data
        run: |
          curl -sSfL -o gen.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          unzip -q gen.zip -d gen
          cargo build --release --manifest-path gen/generator/Cargo.toml
          gen/generator/target/release/generate --seed 11 --events "$EVENTS" --clicks $(( EVENTS / 4 )) --output /tmp/data
      - name: Build native binary
        run: |
          if grep -q avx2 /proc/cpuinfo; then
            cd native && RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release
          else
            echo "::notice::CPU lacks AVX2, using plain build"
            cd native && cargo build --release
          fi
      - name: Warm page cache
        run: cat /tmp/data/*/*.csv /tmp/data/*.csv > /dev/null
      - name: Native runs (x5)
        if: inputs.modes == ''
        run: |
          : > walls.txt; : > rss.txt
          for i in 1 2 3 4 5; do
            DATA_DIR=/tmp/data OUTPUT_DIR=/tmp/out$i NCPU=$(nproc) \
              /usr/bin/time -v native/target/release/shopping-sessions 2> run$i.err > /dev/null
            grep -E "total|^mem" run$i.err || true
            grep -E "Elapsed \(wall clock\)|Maximum resident set size" run$i.err
            grep "Elapsed (wall clock)" run$i.err | awk -F': ' '{print $2}' | awk -F: '{ if (NF==3) print $1*3600+$2*60+$3; else print $1*60+$2 }' >> walls.txt
            grep "Maximum resident set size" run$i.err | awk '{print $NF}' >> rss.txt
          done
      - name: Compare output with main build
        if: inputs.modes == ''
        run: |
          git fetch -q origin main
          git worktree add -q /tmp/base origin/main
          (cd /tmp/base/native && RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release -q)
          for i in 1 2 3; do DATA_DIR=/tmp/data OUTPUT_DIR=/tmp/outbase$i NCPU=$(nproc) /tmp/base/native/target/release/shopping-sessions 2>&1 | head -1 | sed "s/^/BASE /"; done
          pip install -q polars==2.0.0 pyarrow==25.0.1
          cd scripts && python compare.py /tmp/out1 /tmp/outbase1
      - name: Docker run (x1)
        if: inputs.modes == ''
        run: |
          docker build -t ss .
          start=$(date +%s%N)
          IMAGE=ss CPUS=$(nproc) MEM=6g scripts/docker_run.sh /tmp/data /tmp/outd
          end=$(date +%s%N)
          echo $(( (end - start) / 1000000 )) > docker_ms.txt
          echo "DOCKER_RUN_MS $(cat docker_ms.txt)"
          for i in 1 2 3; do s=$(date +%s%N); docker run --rm --network none --read-only --user 1000:1000 --entrypoint /bin/true ss; e=$(date +%s%N); echo "EMPTY_CONTAINER_MS $(( (e - s) / 1000000 ))"; done
      - name: Summary
        if: inputs.modes == ''
        run: |
          median=$(sort -n walls.txt | sed -n 3p)
          peak=$(sort -n rss.txt | tail -1)
          docker_ms=$(cat docker_ms.txt)
          {
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Native median wall (s, 5 runs) | ${median} |"
            echo "| Native peak RSS (kB) | ${peak} |"
            echo "| Docker run wall (ms) | ${docker_ms} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Knob variants (modes = knobs:a,b,...)
        if: startsWith(inputs.modes, 'knobs:')
        env:
          MODES: ${{ inputs.modes }}
        run: |
          lscpu | grep -E "Model name|L2|L3"
          V=$(echo "${MODES#knobs:}" | tr ',' ' ')
          for round in 1 2 3 4 5; do
            for k in $V; do
              echo "KNOB $k $(KNOBS=$k DATA_DIR=/tmp/data OUTPUT_DIR=/tmp/ok_$k NCPU=$(nproc) native/target/release/shopping-sessions 2>&1 | head -1 | grep -o 'parse.*total [0-9]* ms')"
            done
          done
          pip install -q polars==2.0.0 pyarrow==25.0.1
          for k in $V; do (cd scripts && python compare.py /tmp/ok_$k /tmp/ok_$(echo $V | cut -d' ' -f1) | tail -1); done
      - name: Modes A/B (scorer emulation)
        if: inputs.modes != '' && inputs.modes != 'perf' && !startsWith(inputs.modes, 'knobs:')
        env:
          MODES: ${{ inputs.modes }}
          BASE: ${{ inputs.base }}
        run: |
          git fetch -q origin "$BASE" || true
          git worktree add -q /tmp/base "origin/$BASE" 2>/dev/null || git worktree add -q /tmp/base FETCH_HEAD
          (cd /tmp/base/native && RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release -q)
          NEW=$PWD/native/target/release/shopping-sessions
          OLD=/tmp/base/native/target/release/shopping-sessions
          echo '#include <stdlib.h>' > /tmp/hog.c
          echo '#include <string.h>' >> /tmp/hog.c
          echo 'int main(){size_t n=256u<<20;char*a=malloc(n),*b=malloc(n);memset(a,1,n);memset(b,2,n);for(;;){memcpy(b,a,n);memcpy(a,b,n);}}' >> /tmp/hog.c
          gcc -O2 -o /tmp/hog /tmp/hog.c
          lscpu | grep -E "Model name|Thread|Core|Socket|L3"
          one() { # label bin cpus ncpu out
            local t0 t1 tot
            t0=$(date +%s%N)
            tot=$(DATA_DIR=/tmp/data OUTPUT_DIR=$5 NCPU=$4 taskset -c $3 $2 2>&1 | grep -o "total [0-9]* ms")
            t1=$(date +%s%N)
            echo "$1 $tot wall $(( (t1 - t0) / 1000000 )) ms"
          }
          for mode in $MODES; do
            for round in 1 2 3; do
              for side in old new; do
                if [ $side = old ]; then B=$OLD; else B=$NEW; fi
                case $mode in
                  warm) one "MODE warm $side" $B 0-3 4 /tmp/o_$side ;;
                  cold) sync; echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
                        one "MODE cold $side" $B 0-3 4 /tmp/o_$side ;;
                  warm3) one "MODE warm3 $side" $B 0-2 3 /tmp/o_$side ;;
                  hog) taskset -c 3 /tmp/hog & H=$!; sleep 0.3
                       one "MODE hog $side" $B 0-2 3 /tmp/o_$side; kill $H; wait $H 2>/dev/null || true ;;
                  twin) one "MODE twin-a $side" $B 0-1 2 /tmp/o_$side & one "MODE twin-b $side" $B 2-3 2 /tmp/o2_$side; wait ;;
                  solo2) one "MODE solo2 $side" $B 0-1 2 /tmp/o_$side ;;
                esac
              done
            done
          done
          pip install -q polars==2.0.0 pyarrow==25.0.1
          cd scripts && python compare.py /tmp/o_new /tmp/o_old
      - name: Perf profile (modes contains perf)
        if: contains(inputs.modes, 'perf')
        run: |
          sudo apt-get install -y -q linux-tools-common linux-tools-$(uname -r) > /dev/null 2>&1 || sudo apt-get install -y -q linux-tools-azure > /dev/null 2>&1 || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); [ -z "$PERF" ] && PERF=perf
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          (cd native && CARGO_PROFILE_RELEASE_DEBUG=line-tables-only CARGO_PROFILE_RELEASE_STRIP=none RUSTFLAGS="-C target-cpu=x86-64-v3 -C force-frame-pointers=yes" cargo build --release -q --target-dir target-dbg)
          BIN=native/target-dbg/release/shopping-sessions
          lscpu | grep -E "Model name|Thread"
          DATA_DIR=/tmp/data OUTPUT_DIR=/tmp/op NCPU=$(nproc) $BIN 2>&1 | grep total
          echo "=== perf stat"
          DATA_DIR=/tmp/data OUTPUT_DIR=/tmp/op NCPU=$(nproc) $PERF stat -e cycles,instructions,cache-misses,branch-misses,task-clock $BIN 2>&1 | tail -15 || true
          echo "=== perf record"
          DATA_DIR=/tmp/data OUTPUT_DIR=/tmp/op NCPU=$(nproc) $PERF record -q -F 1999 -e cpu-clock -o /tmp/perf.data $BIN 2>&1 | grep total || true
          echo "=== by symbol"
          $PERF report -i /tmp/perf.data --stdio --no-children --sort sym 2>/dev/null | grep -v "^#" | grep -v "^$" | head -30
          echo "=== by source line"
          $PERF script -i /tmp/perf.data -F ip,sym,symoff > /tmp/ps.txt 2> /tmp/ps.err || true
          head -3 /tmp/ps.txt; head -3 /tmp/ps.err; wc -l /tmp/ps.txt
          python3 scripts/perf_lines.py $BIN 50 < /tmp/ps.txt 2>&1 | head -90
